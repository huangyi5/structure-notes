site_name: 结构笔记

site_description: 结构工程师的技术笔记、计算表格与教程
site_author: 结构工程师
repo_url: https://github.com/huangyi5/structure-notes
edit_uri: blob/main/docs/

theme:
  name: material
  language: zh
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-night
        name: 切换暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: 切换亮色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - tags

markdown_extensions:
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - footnotes
  - meta
  - tables

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/huangyi5/structure-notes
      name: GitHub 仓库
  copyright: "&copy; 2026 结构笔记 — Powered by MkDocs Material"

nav:
  - 🏠 首页: index.md
  - 📐 计算表格:
      - 📏 常用截面特性: sheets/section-properties.md
  - 📝 结构笔记:
      - 📖 设计心得: notes/design-notes.md
      - 📚 规范阅读笔记: notes/reading-notes.md
      - ⌨️ 常用命令: notes/cad-commands.md
  - 🔗 教程链接: tutorials.md
  - 🏷️ 标签: tags.md
  - 💬 关于: about.md
